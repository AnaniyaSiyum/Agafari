name: Agafari CI Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Dependency Vulnerability Audit
        working-directory: frontend
        run: npm run audit:ci

      - name: Run TypeScript Type Check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run Unit Tests
        working-directory: frontend
        run: npm run test:unit

      - name: Run Integration Tests
        working-directory: frontend
        run: npm run test:integration

      - name: Build Next.js Production Bundle
        working-directory: frontend
        env:
          TICKET_SIGNING_SECRET: "ci_build_ticket_signing_secret_key_32bytes"
          JWT_SECRET: "ci_build_jwt_session_signing_secret_key_32bytes"
        run: npm run build
