; =============================================================================
; AGAFARI PHP BACKEND — Per-directory PHP runtime overrides (.user.ini)
; Uploaded to: php-backend/ root on the cPanel/LiteSpeed server.
; PHP2Shell CVE-2026-109619 mitigation: disable session upload progress.
; =============================================================================

; --- PHP2Shell Mitigation (CVE-2026-109619) ----------------------------------
; Session upload progress tracking uses the same stale global state pathway
; exploited by the vulnerability. Disabling it closes the most accessible RCE path.
session.upload_progress.enabled = 0
session.upload_progress.cleanup = 1

; --- General Hardening -------------------------------------------------------
; Disable PHP information disclosure headers
expose_php = Off

; Disable dangerous functions that should never be called from web code
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,putenv

; Prevent PHP from following symbolic links out of the web root
open_basedir = /home/:/tmp/

; Enforce strict error display settings (errors go to log, not HTTP response)
display_errors = Off
display_startup_errors = Off
log_errors = On

; Limit execution time and memory to reduce DoS surface
max_execution_time = 30
memory_limit = 128M

; Restrict POST data size to prevent memory exhaustion attacks
post_max_size = 8M
upload_max_filesize = 8M
